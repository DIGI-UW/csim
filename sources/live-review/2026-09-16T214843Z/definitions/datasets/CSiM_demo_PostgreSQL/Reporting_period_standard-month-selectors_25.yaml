table_name: "Reporting period \u2014 standard-month-selectors"
main_dttm_col: month_date
currency_code_column: null
description: Applied date boundaries and grouping; no reporting records or measures.
default_endpoint: null
offset: 0
cache_timeout: null
catalog: csim_demo
schema: v1
sql: "{% set period = get_time_filter('month_date', strftime='%Y-%m-%d %H:%M:%S',\
  \ remove_filter=True) %}\nWITH bounds AS (\n  SELECT {% if period.from_expr %}TIMESTAMP\
  \ '{{ period.from_expr }}'{% else %}NULL::timestamp{% endif %} AS start_date,\n\
  \         {% if period.to_expr %}TIMESTAMP '{{ period.to_expr }}'{% else %}NULL::timestamp{%\
  \ endif %} AS end_date\n)\nSELECT COALESCE(to_char(start_date, 'YYYY-MM-DD HH24:MI'),\
  \ 'No start limit') AS \"Start\",\n       COALESCE(to_char(end_date, 'YYYY-MM-DD\
  \ HH24:MI'), 'No end limit') AS \"End (exclusive)\",\n       '{{ {'P1M':'Month',\
  \ 'P3M':'Quarter', 'P1Y':'Year'}.get(time_grain, 'Month') }}'::text AS \"Group by\"\
  ,\n       CASE WHEN start_date >= end_date THEN 'Choose an end after the start.'\n\
  \       ELSE 'Start included; end excluded. Monthly records use the first day of\
  \ each month. Grouping does not expand the selected dates.' END AS \"Status\",\n\
  \       CURRENT_DATE AS month_date\nFROM bounds\n"
