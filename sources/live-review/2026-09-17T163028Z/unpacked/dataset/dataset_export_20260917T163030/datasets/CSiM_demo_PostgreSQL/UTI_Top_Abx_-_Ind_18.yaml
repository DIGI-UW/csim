cache_timeout: null
catalog: csim_demo
schema: v1
sql: "{% set applied_time = get_time_filter('month_date', strftime='%Y-%m-%d %H:%M:%S')\
  \ %}\n{% set start_at = from_dttm if from_dttm is defined else applied_time.from_expr\
  \ %}\n{% set end_at = to_dttm if to_dttm is defined else applied_time.to_expr %}\n\
  WITH csim_source AS (\nWITH raw_data AS (\n    SELECT\n        hosp_name, location,\
  \ month, year, tx___1,\n        tx___2, tx___3, tx___4, tx___5, tx___6, tx___7,\n\
  \        other_tx___1, other_tx___2, other_tx___3, other_tx___4,\n        other_tx___5,\
  \ other_tx___6, other_tx___7, other_tx___8,\n        other_tx___9, other_tx___10,\
  \ other_tx___11, other_tx___12\n    FROM \"v1\".\"UTI Individual Current\"\n   \
  \ WHERE hosp_name IS NOT NULL\n      AND qi_asb_complete = 2\n      AND month IS\
  \ NOT NULL\n      AND year IS NOT NULL\n\n    UNION ALL\n\n    SELECT\n        hosp_name,\
  \ location, month, year, tx___1,\n        tx___2, tx___3, tx___4, tx___5, tx___6,\
  \ tx___7,\n        other_tx___1, other_tx___2, other_tx___3, other_tx___4,\n   \
  \     other_tx___5, other_tx___6, other_tx___7, other_tx___8,\n        other_tx___9,\
  \ other_tx___10, other_tx___11, other_tx___12\n    FROM \"v1\".\"UTI Individual\
  \ Historical\"\n    WHERE hosp_name IS NOT NULL\n      AND month IS NOT NULL\n \
  \     AND year IS NOT NULL\n),\n\nantibiotic_long AS (\n    SELECT\n        i.hosp_name,\n\
  \        TRIM(h.state) AS state,\n        i.location,\n        i.month,\n      \
  \  i.year,\n        antibiotic_name,\n        1 AS prescription_count\n    FROM\
  \ raw_data i\n    LEFT JOIN \"v1\".\"CSiM Hospitals and States\" h\n        ON i.hosp_name\
  \ = h.hosp_code\n    CROSS JOIN LATERAL (\n        VALUES\n            (CASE WHEN\
  \ i.tx___2 = 1 THEN 'Ceftriaxone' END),\n            (CASE WHEN i.tx___3 = 1 THEN\
  \ 'Cephalexin' END),\n            (CASE WHEN i.tx___4 = 1 THEN 'Fluoroquinolone'\
  \ END),\n            (CASE WHEN i.tx___5 = 1 THEN 'Nitrofurantoin' END),\n     \
  \       (CASE WHEN i.tx___6 = 1 THEN 'TMP/SMX' END),\n            (CASE WHEN i.tx___7\
  \ = 1 AND (i.other_tx___1 = 1 OR i.other_tx___2 = 1 OR i.other_tx___4 = 1)\n   \
  \               THEN 'Oral beta-lactam' END),\n            (CASE WHEN i.tx___7 =\
  \ 1 AND (i.other_tx___3 = 1 OR i.other_tx___5 = 1 OR i.other_tx___6 = 1\n      \
  \                 OR i.other_tx___7 = 1 OR i.other_tx___8 = 1 OR i.other_tx___9\
  \ = 1\n                       OR i.other_tx___10 = 1 OR i.other_tx___11 = 1 OR i.other_tx___12\
  \ = 1)\n                  THEN 'Other' END)\n    ) AS abx(antibiotic_name)\n   \
  \ WHERE i.tx___1 = 0\n      AND h.hosp_code IS NOT NULL\n      AND antibiotic_name\
  \ IS NOT NULL\n),\n\n-- Location-specific aggregation\nhospital_abx AS (\n    SELECT\n\
  \        hosp_name AS hosp_num,\n        LPAD(hosp_name::TEXT, 2, '0') AS hosp_code,\n\
  \        state,\n        CASE location\n            WHEN 1 THEN 'Ambulatory care\
  \ clinic'\n            WHEN 2 THEN 'Emergency Department'\n            WHEN 3 THEN\
  \ 'Inpatient'\n            WHEN 4 THEN 'Rehab or long-term care'\n            WHEN\
  \ 5 THEN 'Urgent or quick care'\n            WHEN 6 THEN 'Other'\n        END AS\
  \ location_name,\n        location AS location_code,\n        TO_DATE(year::TEXT\
  \ || '-' || LPAD(month::TEXT, 2, '0') || '-01', 'YYYY-MM-DD') AS month_date,\n \
  \       antibiotic_name,\n        SUM(prescription_count) AS prescription_count\n\
  \    FROM antibiotic_long\n    GROUP BY hosp_name, state, location, month, year,\
  \ antibiotic_name\n),\n\n-- All locations combined per hospital\nhospital_abx_allloc\
  \ AS (\n    SELECT\n        hosp_name AS hosp_num,\n        LPAD(hosp_name::TEXT,\
  \ 2, '0') AS hosp_code,\n        state,\n        'All locations' AS location_name,\n\
  \        0 AS location_code,\n        TO_DATE(year::TEXT || '-' || LPAD(month::TEXT,\
  \ 2, '0') || '-01', 'YYYY-MM-DD') AS month_date,\n        antibiotic_name,\n   \
  \     SUM(prescription_count) AS prescription_count\n    FROM antibiotic_long\n\
  \    GROUP BY hosp_name, state, month, year, antibiotic_name\n),\n\ncombined_hosp\
  \ AS (\n    SELECT * FROM hospital_abx\n    UNION ALL\n    SELECT * FROM hospital_abx_allloc\n\
  ),\n\nstate_abx AS (\n    SELECT\n        NULL::BIGINT AS hosp_num,\n        state\
  \ AS hosp_code,\n        state,\n        location_name, location_code, month_date,\n\
  \        antibiotic_name,\n        SUM(prescription_count) AS prescription_count\n\
  \    FROM combined_hosp\n    GROUP BY state, location_name, location_code, month_date,\
  \ antibiotic_name\n),\n\ncohort_abx AS (\n    SELECT\n        NULL::BIGINT AS hosp_num,\n\
  \        'Cohort' AS hosp_code,\n        'ALL' AS state,\n        location_name,\
  \ location_code, month_date,\n        antibiotic_name,\n        SUM(prescription_count)\
  \ AS prescription_count\n    FROM combined_hosp\n    GROUP BY location_name, location_code,\
  \ month_date, antibiotic_name\n),\n\nall_levels AS (\n    SELECT * FROM combined_hosp\n\
  \    UNION ALL\n    SELECT * FROM state_abx\n    UNION ALL\n    SELECT * FROM cohort_abx\n\
  ),\n\nranked AS (\n    SELECT\n        *,\n        ROW_NUMBER() OVER (\n       \
  \     PARTITION BY hosp_code, location_code, month_date\n            ORDER BY prescription_count\
  \ DESC, antibiotic_name\n        ) AS rnk\n    FROM all_levels\n)\n\nSELECT\n  \
  \  hosp_num, hosp_code, state,\n    location_name, location_code, month_date,\n\
  \    antibiotic_name, prescription_count, rnk\nFROM ranked\nWHERE rnk <= 3\nORDER\
  \ BY month_date, hosp_code, location_code, rnk\n), observed AS (\n  SELECT * FROM\
  \ csim_source WHERE TRUE\n  {% if start_at %} AND month_date >= TIMESTAMP '{{ start_at\
  \ }}' {% endif %}\n  {% if end_at %} AND month_date < TIMESTAMP '{{ end_at }}' {%\
  \ endif %}\n), bounds AS (\n  SELECT {% if start_at %} TIMESTAMP '{{ start_at }}'\
  \ {% else %} first_month {% endif %} AS start_at,\n         {% if end_at %} TIMESTAMP\
  \ '{{ end_at }}' {% else %} last_month + INTERVAL '1 month' {% endif %} AS end_at\n\
  \  FROM (SELECT MIN(month_date) AS first_month, MAX(month_date) AS last_month FROM\
  \ observed) observed_bounds\n), calendar AS (\n  SELECT value::date AS month_date\
  \ FROM bounds,\n    LATERAL generate_series(date_trunc('month', start_at),\n   \
  \   date_trunc('month', end_at - INTERVAL '1 microsecond'), INTERVAL '1 month')\
  \ AS value\n), dimensions AS (\n  SELECT DISTINCT hosp_num, hosp_code, state, location_name,\
  \ location_code, antibiotic_name\n  FROM observed\n)\nSELECT d.hosp_num, d.hosp_code,\
  \ d.state, d.location_name, d.location_code,\n       c.month_date, d.antibiotic_name,\
  \ o.prescription_count, o.rnk\nFROM dimensions d CROSS JOIN calendar c\nLEFT JOIN\
  \ observed o ON o.hosp_code = d.hosp_code\n  AND o.location_code IS NOT DISTINCT\
  \ FROM d.location_code\n  AND o.month_date = c.month_date AND o.antibiotic_name\
  \ = d.antibiotic_name\nORDER BY c.month_date, d.hosp_code, d.location_code, d.antibiotic_name\n"
