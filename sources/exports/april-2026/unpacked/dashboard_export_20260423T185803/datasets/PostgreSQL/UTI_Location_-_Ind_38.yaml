cache_timeout: null
catalog: data
schema: v1
sql: "WITH raw_data AS (\r\n    SELECT\r\n        hosp_name, location, month, year\r\
  \n    FROM \"v1\".\"UTI Individual Current\"\r\n    WHERE hosp_name IS NOT NULL\r\
  \n      AND qi_asb_complete = 2\r\n      AND month IS NOT NULL\r\n      AND year\
  \ IS NOT NULL\r\n\r\n    UNION ALL\r\n\r\n    SELECT\r\n        hosp_name, location,\
  \ month, year\r\n    FROM \"v1\".\"UTI Individual Historical\"\r\n    WHERE hosp_name\
  \ IS NOT NULL\r\n      AND month IS NOT NULL\r\n      AND year IS NOT NULL\r\n),\r\
  \n\r\nhospital_loc AS (\r\n    SELECT \r\n        i.hosp_name AS hosp_num,\r\n \
  \       LPAD(i.hosp_name::TEXT, 2, '0') AS hosp_code,\r\n        TRIM(h.state) AS\
  \ state,\r\n        CASE i.location\r\n            WHEN 1 THEN 'Ambulatory care\
  \ clinic'\r\n            WHEN 2 THEN 'Emergency Department'\r\n            WHEN\
  \ 3 THEN 'Inpatient'\r\n            WHEN 4 THEN 'Rehab or long-term care'\r\n  \
  \          WHEN 5 THEN 'Urgent or quick care'\r\n            WHEN 6 THEN 'Other'\r\
  \n        END AS location_name,\r\n        i.location AS location_code,\r\n    \
  \    TO_DATE(i.year::TEXT || '-' || LPAD(i.month::TEXT, 2, '0') || '-01', 'YYYY-MM-DD')\
  \ AS month_date,\r\n        COUNT(*) AS n_submissions\r\n    FROM raw_data i\r\n\
  \    LEFT JOIN \"v1\".\"CSiM Hospitals and States\" h \r\n        ON i.hosp_name\
  \ = h.hosp_code\r\n    WHERE h.hosp_code IS NOT NULL\r\n    GROUP BY i.hosp_name,\
  \ TRIM(h.state), i.location, i.month, i.year\r\n),\r\n\r\n-- All locations combined\
  \ per hospital per month\r\nhospital_loc_allloc AS (\r\n    SELECT \r\n        i.hosp_name\
  \ AS hosp_num,\r\n        LPAD(i.hosp_name::TEXT, 2, '0') AS hosp_code,\r\n    \
  \    TRIM(h.state) AS state,\r\n        'All locations' AS location_name,\r\n  \
  \      0 AS location_code,\r\n        TO_DATE(i.year::TEXT || '-' || LPAD(i.month::TEXT,\
  \ 2, '0') || '-01', 'YYYY-MM-DD') AS month_date,\r\n        COUNT(*) AS n_submissions\r\
  \n    FROM raw_data i\r\n    LEFT JOIN \"v1\".\"CSiM Hospitals and States\" h \r\
  \n        ON i.hosp_name = h.hosp_code\r\n    WHERE h.hosp_code IS NOT NULL\r\n\
  \    GROUP BY i.hosp_name, TRIM(h.state), i.month, i.year\r\n),\r\n\r\ncombined\
  \ AS (\r\n    SELECT * FROM hospital_loc\r\n    UNION ALL\r\n    SELECT * FROM hospital_loc_allloc\r\
  \n),\r\n\r\nstate_loc AS (\r\n    SELECT \r\n        NULL::BIGINT AS hosp_num,\r\
  \n        state AS hosp_code,\r\n        state,\r\n        location_name,\r\n  \
  \      location_code,\r\n        month_date,\r\n        SUM(n_submissions) AS n_submissions\r\
  \n    FROM combined\r\n    GROUP BY state, location_name, location_code, month_date\r\
  \n),\r\n\r\ncohort_loc AS (\r\n    SELECT \r\n        NULL::BIGINT AS hosp_num,\r\
  \n        'Cohort' AS hosp_code,\r\n        'ALL' AS state,\r\n        location_name,\r\
  \n        location_code,\r\n        month_date,\r\n        SUM(n_submissions) AS\
  \ n_submissions\r\n    FROM combined\r\n    GROUP BY location_name, location_code,\
  \ month_date\r\n)\r\n\r\nSELECT * FROM combined\r\nUNION ALL\r\nSELECT * FROM state_loc\r\
  \nUNION ALL\r\nSELECT * FROM cohort_loc\r\nORDER BY month_date, hosp_code, location_code"
