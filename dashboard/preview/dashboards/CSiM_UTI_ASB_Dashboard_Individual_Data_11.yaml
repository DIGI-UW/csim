    id: MARKDOWN-B7A7v4jMD46v0QeBjl_jp
    meta:
      code: |-
        # Asymptomatic Bacteriuria (ASB) Report: Stewardship Opportunities at Your Hospital

        This dashboard is designed for pharmacists at rural hospitals to see the trends in the diagnosis and treatment of asymptomatic bacteriuria (ASB) at their hospital and compare their hospital compare to other similar hospitals. A key focus is the new inappropriate diagnosis of urinary tract infection (UTI) measure that captures both diagnostic and antibiotic stewardship. Based on how each facility compares to other facilties and the current trends, the hospital will decide if they need to dedicate more efforts to addressing diagnosis and/or treatment of ASB and see the impact of their efforts.

        # **This dashboard currently uses individual level pilot data.**
      height: 29
      width: 9
    parents:
